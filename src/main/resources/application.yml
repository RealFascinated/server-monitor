server:
  address: 0.0.0.0
  port: 80
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

# Spring Configuration
spring:
  threads:
    virtual:
      enabled: true

  # Don't serialize null values by default with Jackson
  jackson:
    default-property-inclusion: non_null
    mapper:
      sort-properties-alphabetically: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true
  ai:
    mcp:
      server:
        name: server-monitor
        version: 1.0.0
        protocol: STATELESS
        instructions: >-
          Server Monitor: servers run an agent that reports metrics; you act as the user who owns the API token.
          Start with list_servers for server ids, status and a current CPU/memory/disk snapshot. For history, get
          metric ids and label values (disks, interfaces, containers) from list_metrics, then call query_metrics.
          Outages (a server stopped reporting) are in list_server_incidents.
          Alerting is account-wide: an alert group holds rules and a set of member servers, and every member is
          checked against every rule of the group; the group sends notifications to its one destination. Rules
          never belong to a server; to exclude a server from an alert, remove it from the group
          (set_alert_group_servers). Use list_alert_events with state=firing for what is firing now. Before
          creating or changing a rule, dry-run it with preview_alert_rule. Metric values use the units shown by
          list_metrics (percent is 0-100, temperature is Celsius, bytes are raw bytes). Dates in results are
          ISO-8601 except metric points and previews, which use Unix epoch seconds.
        streamable-http:
          mcp-endpoint: /mcp
  datasource:
    url: jdbc:postgresql://localhost:5432/monitor
    username: monitor
    password: monitor
    hikari:
      maximum-pool-size: 200
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration

monitor:
  website-url: http://localhost:5173
  encryption-secret: "set_me" # openssl rand -hex 32
  maxmind:
    license: ""
    database-dir: work/geoip
  agent:
    github-owner: RealFascinated
    github-repo: server-monitor
    tag-prefix: agent/v
    release-cache-ttl: 5m
  victoriametrics:
    import-url: http://localhost:8428/api/v1/import/prometheus
    delete-token: "set_me" # VictoriaMetrics -httpAuthKey for admin/tsdb/delete_series
  servers:
    offline-threshold: 2m
    connectivity-probe-url: https://connectivitycheck.gstatic.com/generate_204
    connectivity-timeout: 5s
  metrics:
    enabled: true
    refresh-interval: 30s
  mail:
    enabled: false
    host: localhost
    port: 1025
    username: ""
    password: ""
    tls: false
    ssl: false
    from: Monitor <noreply@localhost>

logging:
  pattern:
    console: "%level %logger{36} - %msg%n"
  level:
    cc.fascinated.monitor: info